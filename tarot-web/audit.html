<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>풀림 타로 · 카드 78장 점검</title><style>body{font-family:system-ui;background:#171625;color:#ece7db;margin:0;padding:20px}main{max-width:1050px;margin:auto}a{color:#e3c897}button{padding:12px 16px;border:0;border-radius:8px;background:#dec58e;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin:20px 0}.card{border:1px solid #444052;padding:7px;border-radius:9px;background:#252332;font-size:12px;word-break:break-all}.card img{width:100%;aspect-ratio:0.6;object-fit:fill;background:#342f43}.good{color:#96d7a2}.bad{color:#ffa9a9}.pending{color:#c7bdc8}</style></head><body><main><a href="./">← 타로 사이트</a><h1>78장 이미지 점검</h1><p>각 카드 그림을 실제로 브라우저에서 불러옵니다. 기본 이미지가 실패하면 대체 경로를 확인합니다. 그림의 시각적 동일성이나 라이선스까지 자동 판별하는 검사는 아닙니다.</p><button id="run">78장 검사 시작</button><p id="summary">미검사</p><div class="grid" id="grid"></div><script>
const suits=[["완드","wa"],["컵","cu"],["소드","sw"],["펜타클","pe"]];const ranks=[["에이스","ac"],...Array.from({length:9},(_,i)=>[String(i+2),String(i+2).padStart(2,"0")]),["페이지","pa"],["나이트","kn"],["퀸","qu"],["킹","ki"]];const major=["바보","마법사","여사제","여황제","황제","교황","연인","전차","힘","은둔자","운명의 수레바퀴","정의","매달린 남자","죽음","절제","악마","탑","별","달","태양","심판","세계"];const cards=[...major.map((name,i)=>({name,code:"ar"+String(i).padStart(2,"0")})),...suits.flatMap(([name,code])=>ranks.map(([r,rc])=>({name:name+" "+r,code:code+rc})))];const root=document.getElementById("grid"),status=document.getElementById("summary");let running=false;
function load(url){return new Promise(resolve=>{const image=new Image();const timeout=setTimeout(()=>{image.onload=image.onerror=null;resolve(false)},9000);image.onload=()=>{clearTimeout(timeout);resolve(image.naturalWidth>0&&image.naturalHeight>0)};image.onerror=()=>{clearTimeout(timeout);resolve(false)};image.src=url})}
async function check(c){const a="https://petaloverflow.github.io/tarot-api/cards/"+c.code+".jpg",b="https://raw.githubusercontent.com/seven102161/elaine-tarot-cards/main/cards/"+c.code+".jpg";const el=document.createElement("div");el.className="card";el.innerHTML='<div class="pending">검사 중</div><strong>'+c.name+'</strong>';root.appendChild(el);let valid=await load(a),from="기본";if(!valid){valid=await load(b);from="대체"}el.innerHTML='<img alt="'+c.name+'"><div class="'+(valid?"good":"bad")+'">'+(valid?"성공 · "+from:"실패")+'</div><strong>'+c.name+'</strong><p>'+c.code+'</p>';if(valid)el.querySelector("img").src=from==="기본"?a:b;return {code:c.code,name:c.name,ok:valid,from}}
document.getElementById("run").onclick=async()=>{if(running)return;running=true;root.innerHTML="";status.textContent="검사 진행 중";const found=[];for(let i=0;i<cards.length;i+=6){found.push(...await Promise.all(cards.slice(i,i+6).map(check)));status.textContent=found.length+"/78 검사 · 정상 "+found.filter(x=>x.ok).length+" · 실패 "+found.filter(x=>!x.ok).length}const unique=new Set(cards.map(x=>x.code)).size;status.textContent="완료 · 78장 코드 고유 "+unique+"/78 · 이미지 로드 성공 "+found.filter(x=>x.ok).length+"/78 · 실패 "+found.filter(x=>!x.ok).length;running=false};
</script></main></body></html>
